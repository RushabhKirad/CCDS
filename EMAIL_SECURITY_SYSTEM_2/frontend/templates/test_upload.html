<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mode - Direct File Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .upload-area {
            border: 2px dashed #ced4da;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #0d6efd;
            background-color: #f1f8ff;
        }
        .result-card {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-microscope"></i> Direct File Analysis (Test Mode)</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Upload an email attachment (PDF, Image) or a screenshot to analyze it directly without sending an email.</p>
                        
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="upload-area" id="dropZone">
                                <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                                <h5>Drag & Drop or Click to Upload</h5>
                                <p class="text-muted small">Supports: PDF, JPG, PNG</p>
                                <input type="file" name="file" id="fileInput" class="d-none" accept=".pdf,.jpg,.jpeg,.png">
                            </div>
                        </form>

                        <div id="loading" class="text-center mt-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Analyzing file with AI & OCR...</p>
                        </div>

                        <div id="resultCard" class="card result-card">
                            <div class="card-body">
                                <h5 class="card-title" id="resultTitle">Analysis Result</h5>
                                <div id="resultContent"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="/dashboard" class="text-decoration-none"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0d6efd';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ced4da';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ced4da';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleUpload();
            }
        });

        fileInput.addEventListener('change', handleUpload);

        function handleUpload() {
            if (!fileInput.files.length) return;

            const formData = new FormData(uploadForm);
            
            loading.style.display = 'block';
            resultCard.style.display = 'none';

            fetch('/test/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                resultCard.style.display = 'block';
                
                if (data.success) {
                    const isSafe = data.prediction === 'safe';
                    const color = isSafe ? 'success' : 'danger';
                    const icon = isSafe ? 'check-circle' : 'exclamation-triangle';
                    
                    resultCard.className = `card result-card border-${color}`;
                    resultTitle.innerHTML = `<span class="text-${color}"><i class="fas fa-${icon}"></i> ${data.prediction.toUpperCase()}</span>`;
                    
                    let html = `
                        <p><strong>Confidence:</strong> ${(data.confidence * 100).toFixed(1)}%</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                    `;
                    
                    if (data.ocr_text) {
                        html += `<div class="mt-3"><strong><i class="fas fa-eye"></i> OCR Extracted Text:</strong><br>
                                 <small class="text-muted bg-light p-2 d-block rounded">${data.ocr_text}</small></div>`;
                    }
                    
                    resultContent.innerHTML = html;
                } else {
                    resultCard.className = 'card result-card border-danger';
                    resultTitle.innerHTML = '<span class="text-danger">Error</span>';
                    resultContent.innerHTML = `<p>${data.error}</p>`;
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                alert('Upload failed: ' + error);
            });
        }
    </script>
</body>
</html>
