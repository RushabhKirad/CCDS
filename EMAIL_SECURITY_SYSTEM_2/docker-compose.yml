version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=email_security_system
    depends_on:
      - db
    volumes:
      - .:/app
      - ./logs:/app/logs

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: email_security_system
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./add_database_indexes.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
